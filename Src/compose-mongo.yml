name: business-calendar
services:
  web-api:
    extends:
      file: compose-base.yml
      service: web-api
    environment:
      Storage__DatabaseType: "MongoDb"
      MongoDB__ConnectionURI: "mongodb://mongodb:27017"
    depends_on:
      mongodb:
        condition: service_healthy

  mongodb:
    image: mongo:8.0
    ports:
      - "4081:27017"
    volumes:
      - mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  mongo: